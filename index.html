<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>清商怨</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background-color: #D0D1E6;

            color: #26383B;

            font-family:
                "Noto Serif SC",
                "Songti SC",
                "STSong",
                serif;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }


        .container {
            width: min(760px, 90%);
            min-height: 80vh;

            padding: 80px 60px;

            text-align: center;

            border: 1px solid rgba(38, 56, 59, 0.28);

            position: relative;
        }


        /* 左上角、右下角装饰 */

        .container::before,
        .container::after {

            content: "❖";

            position: absolute;

            font-size: 14px;

            color: #394B63;

        }


        .container::before {

            top: 18px;
            left: 22px;

        }


        .container::after {

            bottom: 18px;
            right: 22px;

        }


        /* 标题 */

        h1 {

            margin: 0;

            font-size: 46px;

            font-weight: 400;

            letter-spacing: 12px;

            color: #26383B;

        }


        /* 副标题 */

        .subtitle {

            margin-top: 20px;

            font-size: 15px;

            letter-spacing: 6px;

            color: #647B80;

        }


        /* 藏青色分隔线 */

        .divider {

            width: 80px;

            margin: 45px auto;

            border-top: 1px solid #394B63;

        }


        /* 菜单 */

        nav {

            display: flex;

            flex-direction: column;

            gap: 20px;

        }


        nav a {

            text-decoration: none;

            color: #354B4F;

            font-size: 18px;

            letter-spacing: 5px;

            transition: 0.3s;

        }


        nav a:hover {

            color: #394B63;

            letter-spacing: 8px;

        }


        /* 藏青色印章 */

        .seal {

            margin-top: 60px;

            width: 55px;
            height: 55px;

            display: inline-flex;

            justify-content: center;

            align-items: center;

            border: 2px solid #394B63;

            color: #394B63;

            font-size: 15px;

            writing-mode: vertical-rl;

            letter-spacing: 2px;

        }


        /* 手机端 */

        @media (max-width: 600px) {

            .container {

                width: 88%;

                min-height: 85vh;

                padding: 60px 25px;

            }


            h1 {

                font-size: 34px;

                letter-spacing: 8px;

            }


            .subtitle {

                font-size: 13px;

                letter-spacing: 4px;

            }


            nav a {

                font-size: 16px;

            }

        }

    </style>

</head>


<body>

    <main class="container">

        <h1>清商怨</h1>

        <div class="subtitle">
            欲买桂花同载酒·终不似·少年游
        </div>

        <div class="divider"></div>

        <nav>

            <a href="#">文集</a>

            <a href="#">杂记</a>

            <a href="#">清讴</a>

            <a href="#">关于</a>

        </nav>

        <div class="seal">
            慈昭
            襟雪
        </div>

    </main>

</body>

</html>
