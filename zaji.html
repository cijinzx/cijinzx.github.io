<!DOCTYPE html>

<html lang="zh-CN">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>杂记 · 清商怨</title>


<style>

    * {
        box-sizing: border-box;
    }


    body {

        margin: 0;

        min-height: 100vh;

        background-color: #D0D1E6;

        color: #26383B;

        font-family:
            "Noto Serif SC",
            "Songti SC",
            "STSong",
            serif;

        padding: 70px 20px;
    }


    .page {

        width: min(700px, 92%);

        margin: 0 auto;
    }


    /* =========================
       标题
       ========================= */

    header {

        text-align: center;

        margin-bottom: 70px;
    }


    h1 {

        margin: 0;

        font-size: 42px;

        font-weight: 400;

        letter-spacing: 12px;
    }


    .subtitle {

        margin-top: 18px;

        font-size: 14px;

        letter-spacing: 5px;

        color: #647B80;
    }


    .divider {

        width: 60px;

        margin: 35px auto;

        border-top: 1px solid #394B63;
    }


    /* =========================
       暂无杂记
       ========================= */

    .empty {

        text-align: center;

        padding: 40px 10px;

        color: #647B80;

        font-size: 15px;

        letter-spacing: 3px;

        line-height: 2.5;
    }


    .empty span {

        display: block;

        font-size: 12px;

        letter-spacing: 2px;

        color: #7A898C;
    }


    /* =========================
       返回首页
       ========================= */

    .back {

        display: block;

        margin-top: 70px;

        text-align: center;

        color: #394B63;

        text-decoration: none;

        font-size: 14px;

        letter-spacing: 4px;

        transition: 0.3s;
    }


    .back:hover {

        letter-spacing: 6px;
    }


    /* =========================
       手机端
       ========================= */

    @media (max-width: 600px) {

        body {

            padding: 50px 15px;
        }


        h1 {

            font-size: 34px;

            letter-spacing: 8px;
        }

    }

</style>
```

</head>

<body>

```
<main class="page">


    <!-- =========================
         页面标题
         ========================= -->

    <header>

        <h1>杂记</h1>

        <div class="subtitle">
            随笔 · 想法
        </div>

        <div class="divider"></div>

    </header>


    <!-- =========================
         暂无杂记
         ========================= -->

    <div class="empty">

        暂无杂记

        <span>
            空
        </span>

    </div>


    <!-- =========================
         返回首页
         ========================= -->

    <a class="back" href="index.html">
        ← 返回清商怨
    </a>


</main>
```

</body>

</html>
