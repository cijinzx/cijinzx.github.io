<!DOCTYPE html>

<html lang="zh-CN">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>第一篇文章 · 清商怨</title>

<style>

    * {
        box-sizing: border-box;
    }


    body {
        margin: 0;

        min-height: 100vh;

        background-color: #D0D1E6;

        color: #26383B;

        font-family:
            "Noto Serif SC",
            "Songti SC",
            "STSong",
            serif;

        padding: 80px 20px;
    }


    .article-page {
        width: min(720px, 92%);

        margin: 0 auto;
    }


    /* 标题 */

    header {
        text-align: center;

        margin-bottom: 70px;
    }


    h1 {
        margin: 0;

        font-size: 38px;

        font-weight: 400;

        letter-spacing: 8px;

        line-height: 1.6;
    }


    .date {
        margin-top: 18px;

        font-size: 12px;

        color: #647B80;

        letter-spacing: 3px;
    }


    .divider {
        width: 60px;

        margin: 35px auto;

        border-top: 1px solid #394B63;
    }


    /* 正文 */

    .content {
        font-size: 16px;

        line-height: 2.4;

        letter-spacing: 1px;

        color: #34494D;
    }


    .content p {
        margin: 0 0 28px 0;

        text-indent: 2em;
    }


    /* 引用 */

    .quote {
        margin: 40px 20px;

        padding-left: 20px;

        border-left: 2px solid #647B80;

        color: #647B80;

        font-size: 15px;

        line-height: 2.2;
    }


    /* 返回 */

    .back {
        display: block;

        margin-top: 80px;

        padding-top: 30px;

        border-top: 1px solid
            rgba(57, 75, 99, 0.25);

        text-align: center;

        color: #394B63;

        text-decoration: none;

        font-size: 14px;

        letter-spacing: 4px;
    }


    .back:hover {
        letter-spacing: 6px;
    }


    @media (max-width: 600px) {

        body {
            padding: 50px 15px;
        }


        h1 {
            font-size: 30px;

            letter-spacing: 6px;
        }


        .content {
            font-size: 15px;

            line-height: 2.2;
        }

    }

</style>
```

</head>

<body>

```
<main class="article-page">


    <header>

        <h1>第一篇文章</h1>

        <div class="date">
            2026 · 08 · 30
        </div>

        <div class="divider"></div>

    </header>


    <article class="content">

        <p>
            这里是文章正文。
        </p>


        <p>
            以后你可以把自己的文章直接写在这里。
            每一个段落都可以用一个 p 标签包起来，
            网站会自动按照现在的样式排版。
        </p>


        <p>
            如果文章比较长，也可以继续增加段落。
        </p>


        <div class="quote">
            这里可以放一句你喜欢的话，
            或者文章中的特殊引用。
        </div>


        <p>
            这里是文章的最后一段。
        </p>

    </article>


    <a class="back" href="wenji.html">
        ← 返回文集
    </a>


</main>
```

</body>

</html>
