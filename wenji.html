<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>文集 · 清商怨</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background-color: #D0D1E6;

            color: #26383B;

            font-family:
                "Noto Serif SC",
                "Songti SC",
                "STSong",
                serif;

            padding: 70px 20px;
        }


        .page {
            width: min(760px, 92%);
            margin: 0 auto;
        }


        /* 顶部 */

        header {
            text-align: center;
            margin-bottom: 70px;
        }


        h1 {
            margin: 0;

            font-size: 42px;

            font-weight: 400;

            letter-spacing: 12px;
        }


        .subtitle {
            margin-top: 18px;

            font-size: 14px;

            letter-spacing: 5px;

            color: #647B80;
        }


        .divider {
            width: 70px;

            margin: 35px auto;

            border-top: 1px solid #394B63;
        }


        /* 文章 */

        .article {
            padding: 28px 10px;

            border-bottom: 1px solid
                rgba(57, 75, 99, 0.25);

            transition: 0.3s;
        }


        .article:first-child {
            border-top: 1px solid
                rgba(57, 75, 99, 0.25);
        }


        .article a {
            text-decoration: none;

            color: #26383B;
        }


        .article-title {
            font-size: 22px;

            letter-spacing: 4px;

            margin-bottom: 10px;
        }


        .date {
            font-size: 12px;

            color: #647B80;

            letter-spacing: 2px;

            margin-bottom: 15px;
        }


        .excerpt {
            font-size: 14px;

            line-height: 2;

            color: #53696D;
        }


        .article:hover {
            padding-left: 18px;
        }


        .article:hover .article-title {
            color: #394B63;
        }


        /* 返回首页 */

        .back {
            display: block;

            margin-top: 70px;

            text-align: center;

            color: #394B63;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: 4px;
        }


        .back:hover {
            letter-spacing: 6px;
        }


        @media (max-width: 600px) {

            body {
                padding: 50px 15px;
            }


            h1 {
                font-size: 34px;

                letter-spacing: 8px;
            }


            .article-title {
                font-size: 19px;
            }

        }

    </style>

</head>


<body>

    <main class="page">


        <header>

            <h1>文集</h1>

            <div class="subtitle">
                千秋载笔 · 字里浮生
            </div>

            <div class="divider"></div>

        </header>


        <!-- 第一篇文章 -->

        <article class="article">

            <a href="article1.html">

                <div class="article-title">
                    【邦信】千秋梦
                </div>

                <div class="date">
                    2026 · 08 · 30
                </div>

                <div class="excerpt">
                    /淮阴侯时期 我流邦信 非真实历史 有大量虚构内容切勿当真
/包括不限于：双性 囚禁 控she 窒息
/文笔有限 感谢阅读

                    相见争如不见，有情何似无情。

                </div>

            </a>

        </article>


        <!-- 第二篇文章 -->

        <article class="article">

            <a href="#">

                <div class="article-title">
                    第二篇文章
                </div>

                <div class="date">
                    2026 · 08 · 30
                </div>

                <div class="excerpt">
                    这里以后可以放另一篇文章的简介……
                </div>

            </a>

        </article>


        <!-- 返回首页 -->

        <a class="back" href="index.html">
            ← 返回清商怨
        </a>


    </main>

</body>

</html>
