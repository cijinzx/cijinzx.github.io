<style>

    * {
        box-sizing: border-box;
    }


    body {

        margin: 0;

        min-height: 100vh;

        background-color: #D0D1E6;

        color: #26383B;

        font-family:
            "Noto Serif SC",
            "Songti SC",
            "STSong",
            serif;

        padding: 70px 20px;
    }


    .page {

        width: min(700px, 92%);

        margin: 0 auto;
    }


    /* =========================
       标题
       ========================= */

    header {

        text-align: center;

        margin-bottom: 65px;
    }


    h1 {

        margin: 0;

        font-size: 42px;

        font-weight: 400;

        letter-spacing: 12px;
    }


    .subtitle {

        margin-top: 18px;

        font-size: 14px;

        letter-spacing: 5px;

        color: #647B80;
    }


    .divider {

        width: 60px;

        margin: 35px auto;

        border-top: 1px solid #394B63;
    }


    /* =========================
       信息
       ========================= */

    .profile {

        border-top: 1px solid
            rgba(57, 75, 99, 0.25);
    }


    .item {

        display: grid;

        grid-template-columns: 90px 1fr;

        gap: 25px;

        padding: 25px 10px;

        border-bottom: 1px solid
            rgba(57, 75, 99, 0.25);
    }


    .label {

        font-size: 15px;

        letter-spacing: 3px;

        color: #394B63;
    }


    .content {

        font-size: 14px;

        line-height: 2;

        letter-spacing: 1px;

        color: #53696D;

        min-height: 28px;
    }


    /* =========================
       返回首页
       ========================= */

    .back {

        display: block;

        margin-top: 70px;

        text-align: center;

        color: #394B63;

        text-decoration: none;

        font-size: 14px;

        letter-spacing: 4px;

        transition: 0.3s;
    }


    .back:hover {

        letter-spacing: 6px;
    }


    /* =========================
       手机端
       ========================= */

    @media (max-width: 600px) {

        body {

            padding: 50px 15px;
        }


        h1 {

            font-size: 34px;

            letter-spacing: 8px;
        }


        .item {

            grid-template-columns: 70px 1fr;

            gap: 15px;

            padding: 22px 5px;
        }


        .label {

            font-size: 14px;
        }


        .content {

            font-size: 13px;
        }

    }

</style>
```
